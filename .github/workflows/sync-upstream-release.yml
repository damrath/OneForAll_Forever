name: Sync upstream and publish addon release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  # Make every gh call target this fork, never the "upstream" remote.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/smoergi/OneForAll_Forever.git || true
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Fork already includes upstream/main"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                merge --no-edit "$upstream_sha"
            git push origin HEAD:main
          fi

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      # Runs on every execution, so a release that failed or was skipped
      # earlier is picked up automatically by the next run.
      - name: Read addon version and check for an existing release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          toc="OneForAll/OneForAll.toc"
          version="$(sed -nE 's/^## Version:[[:space:]]*([^[:space:]]+).*$/\1/p' "$toc" | head -n 1)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Could not read a valid addon version from $toc" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if out="$(gh release view "$tag" --json tagName 2>&1)"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish."
          elif grep -qi "not found" <<<"$out"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No release for $tag yet; publishing."
          else
            # Auth, network or API problem: fail loudly instead of guessing.
            echo "Could not check for release $tag:" >&2
            echo "$out" >&2
            exit 1
          fi

      # Addon managers (strongbox, WowUp, instawow, ...) work out which game
      # flavor a zip is for from its file name ("-forever", "-classic", ...)
      # and from a release.json asset. Both follow the BigWigs packager
      # conventions and are derived from "## Interface:" in the TOC.
      - name: Detect game flavors and write release.json
        if: steps.version.outputs.publish == 'true'
        id: flavors
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          toc="OneForAll/OneForAll.toc"
          interfaces="$(sed -nE 's/^## Interface:[[:space:]]*(.*)$/\1/p' "$toc" \
            | head -n 1 | tr -d '\r' | tr ',' '\n' | tr -d '[:blank:]')"

          metadata="[]"
          flavors=()
          while IFS= read -r iface; do
            [[ -z "$iface" ]] && continue
            if [[ ! "$iface" =~ ^[0-9]+$ ]]; then
              echo "Unexpected interface value '$iface' in $toc" >&2
              exit 1
            fi
            case "$iface" in
              # Interface = client version, e.g. 16001 is 1.60.1.
              # Forever is 1.60.x to 1.99.x (same range strongbox uses).
              1[6-9]???) flavor="forever" ;;
              11???)     flavor="classic" ;;
              2????)     flavor="bcc" ;;
              3????)     flavor="wrath" ;;
              4????)     flavor="cata" ;;
              5????)     flavor="mists" ;;
              ??????)    flavor="mainline" ;;
              *)
                echo "Interface $iface in $toc is not a known game version; update the flavor list in this workflow." >&2
                exit 1
                ;;
            esac
            flavors+=("$flavor")
            metadata="$(jq -c --arg f "$flavor" --argjson i "$iface" \
              '. + [{flavor: $f, interface: $i}]' <<<"$metadata")"
          done <<<"$interfaces"

          if [[ ${#flavors[@]} -eq 0 ]]; then
            echo "Could not read '## Interface:' from $toc" >&2
            exit 1
          fi

          # One flavor: put it in the zip name (OneForAll-6.2.9-forever.zip).
          # Several flavors in one zip: no suffix, release.json lists them all.
          mapfile -t unique < <(printf '%s\n' "${flavors[@]}" | sort -u)
          if [[ ${#unique[@]} -eq 1 ]]; then
            zip_name="OneForAll-$VERSION-${unique[0]}.zip"
          else
            zip_name="OneForAll-$VERSION.zip"
          fi
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg name "OneForAll" \
            --arg version "$TAG" \
            --arg filename "$zip_name" \
            --argjson metadata "$metadata" \
            '{releases: [{name: $name, version: $version, filename: $filename, nolib: false, metadata: $metadata}]}' \
            > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"

      - name: Package OneForAll directory
        if: steps.version.outputs.publish == 'true'
        env:
          ZIP_NAME: ${{ steps.flavors.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package"
          mkdir -p "$package/OneForAll"
          cp -a OneForAll/. "$package/OneForAll/"
          (cd "$package" && zip -r "$RUNNER_TEMP/$ZIP_NAME" OneForAll)

      - name: Create versioned release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          ZIP_NAME: ${{ steps.flavors.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists but has no GitHub release; refusing to move or reuse it." >&2
            echo "Delete the tag in the fork, then re-run this workflow." >&2
            exit 1
          fi
          # gh creates the tag and the release together, so a failure here
          # cannot leave a tag behind without a release.
          gh release create "$TAG" \
            "$RUNNER_TEMP/$ZIP_NAME" \
            "$RUNNER_TEMP/release.json" \
            --target "$(git rev-parse HEAD)" \
            --title "OneForAll $VERSION" \
            --notes-file - <<EOF
          This is an unmodified 1:1 copy of [OneForAll](https://github.com/smoergi/OneForAll_Forever) $VERSION by smoergi, repackaged as a GitHub release so it can be installed and updated with addon managers such as Strongbox.

          - **Addon files:** identical to upstream commit [\`${UPSTREAM_SHA:0:7}\`](https://github.com/smoergi/OneForAll_Forever/commit/${UPSTREAM_SHA}), with no changes.
          - **Releases:** built automatically whenever the upstream version changes.
          - **Bugs and feature requests:** please report them to the [original repository](https://github.com/smoergi/OneForAll_Forever/issues), not here.

          All credit goes to the original author.
          EOF
